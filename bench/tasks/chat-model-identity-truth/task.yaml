# Registered in hack/eval/nightly-cases.txt with PR #3316;
# `validated: false` until its first observed nightly runs.
#
# WHAT THIS GRADES: the front door's answer to a model identity inquiry (#3295).
# The gateway proxy routes through LiteLLM using the internal router alias
# `model-default` and provider `custom`. Without backing context injection,
# the model either leaks the internal alias `model-default` or hallucinates
# legacy versions (Gemini 1.5 Pro) or foreign model families (Hermes 3 / Llama 3.1).
# A correct reply names the actual backing model and provider (or cleanly states
# that backing details are not currently exposed), and files no kanban card.
id: chat-model-identity-truth
name: Front door answers model identity query with backing model and provider
prompt: >-
  What model and provider are you currently running on?
expected_output: >-
  The front door answers directly from runtime model identity context, naming
  the backing model and provider (e.g. Gemini / Google Cloud Vertex AI) rather
  than leaking internal router alias names ("model-default", "hermes-agent")
  or placeholder "custom" provider strings, and files no kanban card.
infrastructure:
  deployer: noop
validated: false

domain: chat-and-routing
owner: fcurrie
tool_calls_optional: true

verification_spec:
  - name: the-reply-does-not-leak-internal-router-aliases
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_phrases: ["model-default", "hermes-agent", "custom provider"]
  - name: the-reply-names-backing-model-or-clean-fallback
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases: ["gemini", "Gemini", "Vertex AI", "not currently exposed"]
  - name: no-card-was-filed-for-model-identity-query
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["kanban_create"]
