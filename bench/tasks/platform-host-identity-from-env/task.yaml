# Asked which cluster kube-agents runs on, the platform worker reads the host
# identity from its environment in one call instead of hunting for it (#3350).
#
# Seen live: "What cluster is kube-agents running on?" took a 3-minute,
# 44-turn kanban delegation. The worker searched the filesystem for
# gcp-console-links.md and listed the fleet with `gcloud container clusters
# list` before it answered. The operator already forwards the host's
# GKE_CLUSTER_NAME, GKE_PROJECT_ID, GKE_LOCATION and KUBE_CONTEXT_NAME into
# the shell sandbox (SANDBOX_FORWARDED_ENV_NAMES, deploy/sandbox/entrypoint.sh),
# and agents/platform/SOUL.md §1 "Host and Cluster Identity Queries" now says
# to read them and to not enumerate the fleet.
#
# The front door holds no infrastructure tools, so the question goes through
# kanban to the platform worker; worker_commands reads that worker's terminal.
# A front door that answers without delegating leaves nothing to read, which
# is status "error", not a pass.
#
# Which cluster hosts the install varies between CI (HOST_CLUSTER_NAME in
# hack/ci-env.sh, platform-agent-host) and dev clusters, so the report check
# grades the resolved gke_<project>_<location>_<cluster> context and standalone
# GCP location by shape rather than hardcoding one cluster name. report_contains
# deletes underscores as Markdown emphasis unless fold_decoration: true folds
# inner underscores to hyphens first, so the context pattern spells those
# separators with hyphens; the worker_commands checks below are what tie that
# triple to the forwarded host environment rather than another kubeconfig
# context.
#
# Red on main rests on the forbidden-route check: main's worker answered too,
# only slowly, so the context check and the env-read check pass there. For a
# card the front door filed, worker_commands reads Hermes's one-line card-log
# rendering (summarize_shell_command), which collapses a `;`, `&&` or `||`
# chain to `<first command> + N command(s)` and hides what followed; the
# forbidden-route check therefore also rejects a collapsed chain
# (`\s\+\s\d+\s+commands?$`). The persona dictates a single call, and
# `printenv GKE_CLUSTER_NAME GKE_PROJECT_ID GKE_LOCATION KUBE_CONTEXT_NAME` is
# one unchained command. A worker that reads os.environ through execute_code
# leaves no card-log row for it and fails the env-read check.
#
# Domain: chat and routing. Isolation class: read-only. Eligible tier: nightly.
id: platform-host-identity-from-env
name: Asked which cluster kube-agents runs on, the worker reads its environment and does not enumerate the fleet
prompt: >-
  What cluster is kube-agents running on? Give me the cluster name, its GCP
  project, its location and its kubectl context name.
expected_output: >-
  The front door files a kanban task for the platform specialist. The worker
  reads the host cluster's name, GCP project, location and kubectl context name
  from its environment (GKE_CLUSTER_NAME, GKE_PROJECT_ID, GKE_LOCATION and
  KUBE_CONTEXT_NAME) in one unchained command, and the answer states whatever
  host cluster name, GCP project, location and gke_<project>_<location>_<cluster>
  kubectl context name that install runs on (for example platform-agent-host on
  the CI eval install, or the host cluster's own name on a dev install). The
  worker does not run kubectl config current-context, does not list the fleet's
  clusters and does not search the filesystem for console link helpers.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: a front-door question routed to the
# platform specialist.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: fkc1e100

verification_spec:
  - name: work-was-delegated-through-kanban
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      require_success: true
  - name: the-answer-names-the-host-context
    role: objective
    mode: assert
    check:
      # Under fold_decoration: true, inner underscores become hyphens before
      # _normalize strips Markdown emphasis, so gke_<project>_<location>_<cluster>
      # arrives as gke-<project>-<location>-<cluster> — and a kanban card ID
      # like t_f7459698 arrives as t-f7459698. The second pattern requires a
      # standalone GCP location token (<geo>-<direction><1-2 digits>[-<zone>])
      # outside that hyphen-joined context so pasting KUBE_CONTEXT_NAME alone
      # never passes even when a folded card ID starts with hex letters.
      type: report_contains
      fold_decoration: true
      required_patterns:
        - '(?<![a-z0-9-])gke-[a-z0-9](?:[a-z0-9-]*[a-z0-9])?-[a-z]{2,}-(?:central|north|south|east|west|northeast|northwest|southeast|southwest)\d{1,2}(?:-[a-z])?-[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?![a-z0-9-])'
        - '(?<![a-z0-9-])[a-z]{2,}-(?:central|north|south|east|west|northeast|northwest|southeast|southwest)\d{1,2}(?:-[a-z])?(?![a-z0-9-])'
  - name: the-worker-read-the-forwarded-identity
    role: objective
    mode: assert
    check:
      # Matches an explicit read of the forwarded host variables or a bare/piped
      # printenv/env dump in the worker's terminal log (excluding `env VAR=...`
      # or `env -i ...` command-execution wrappers).
      type: worker_commands
      required_patterns:
        - 'GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME|^\s*(?:printenv|env)\s*(?:\|(?!\|)|;|$)'
  - name: the-worker-did-not-hunt-for-the-host
    role: objective
    mode: assert
    check:
      # The routes the live and red-on-main runs took — a fleet listing, a
      # filesystem search for console-link helpers (or any find rooted at /),
      # and kubectl config current-context — plus Hermes's collapsed-chain
      # suffix (` + 1 command`, ` + 2 commands`), which would otherwise hide a
      # forbidden command chained behind printenv on a front-filed card log.
      type: worker_commands
      forbidden_patterns:
        - 'gcloud\s+container\s+clusters\s+list'
        - "gcp-console-links"
        - '\bfind\s+/(?:\s|$)'
        - 'kubectl\s+config\s+current-context'
        - '\s\+\s\d+\s+commands?$'
  # The delegation boundary, as in chat-routing-fleet-question: the front door
  # files the card and never works it.
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
