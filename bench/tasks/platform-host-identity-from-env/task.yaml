# Asked which cluster kube-agents runs on, the platform worker reads the host
# identity from its environment in one call instead of hunting for it (#3350).
#
# Seen live: "What cluster is kube-agents running on?" took a 3-minute,
# 44-turn kanban delegation. The worker searched the filesystem for
# gcp-console-links.md and listed the fleet with `gcloud container clusters
# list` before it answered. The operator already forwards the host's
# GKE_CLUSTER_NAME, GKE_PROJECT_ID, GKE_LOCATION and KUBE_CONTEXT_NAME into
# the shell sandbox (SANDBOX_FORWARDED_ENV_NAMES, deploy/sandbox/entrypoint.sh),
# and agents/platform/SOUL.md §1 "Host and Cluster Identity Queries" now says
# to read them and to not enumerate the fleet.
#
# The front door holds no infrastructure tools, so the question goes through
# kanban to the platform worker; worker_commands reads that worker's terminal.
# A front door that answers without delegating leaves nothing to read, which
# is status "error", not a pass.
#
# Which cluster hosts the install varies between CI (HOST_CLUSTER_NAME in
# hack/ci-env.sh, platform-agent-host) and dev clusters, so the report check
# grades the resolved gke_<project>_<location>_<cluster> context and standalone
# GCP location by shape rather than hardcoding one cluster name. report_contains
# deletes underscores as Markdown emphasis unless fold_decoration: true folds
# inner underscores to hyphens first, so the context pattern spells those
# separators with hyphens; the worker_commands checks below are what tie that
# triple to the forwarded host environment rather than another kubeconfig
# context.
#
# Red on main rests on the forbidden-route check: main's worker answered too,
# only slowly, so the context check and the env-read check pass there. The
# persona dictates a single tool call, and `max_commands: 1` bounds recorded
# command entries (one per card-log row, or per tagged call on a card with no
# log row — not shell segments, and not execute_code calls on a card that also
# logged a terminal command). For a card the front door filed, worker_commands
# currently grades Hermes's one-line card-log rendering
# (summarize_shell_command), which collapses a `;`, `&&` or `||` chain to
# `<first command> + N command(s)` and joins newline-separated lines with
# spaces and no suffix; the forbidden-route check therefore rejects collapsed
# chains (`\s\+\s\d+\s+commands?$`) and carries quote- and `#`-comment-aware
# text patterns alongside `forbidden_runs` so a second-line `kubectl config` or
# `gcloud container clusters list` joined onto the env-read row (or shelled out
# from `python3 -c`/heredoc) still fails, while splitting an off-denylist
# newline-joined call or counting `execute_code` calls beside a logged terminal
# call awaits #3971. A card that ran only execute_code falls back to its tagged
# call (raw Python source without a leading `python3` shell command, so the
# shell-anchored env-read check rejects it), whereas on a card that also logged
# a terminal command, execute_code calls are absent from the card log and
# dropped until #3971.
#
# Domain: chat and routing. Isolation class: read-only. Eligible tier: nightly.
id: platform-host-identity-from-env
name: Asked which cluster kube-agents runs on, the worker reads its environment and does not enumerate the fleet
prompt: >-
  What cluster is kube-agents running on? Give me the cluster name, its GCP
  project, its location and its kubectl context name.
expected_output: >-
  The front door files a kanban task for the platform specialist. The worker
  reads the host cluster's name, GCP project, location and kubectl context name
  from its environment (GKE_CLUSTER_NAME, GKE_PROJECT_ID, GKE_LOCATION and
  KUBE_CONTEXT_NAME) in a single terminal call (with no ;, && or || command
  chain), and the answer states whatever host cluster name, GCP project,
  location and gke_<project>_<location>_<cluster> kubectl context name that
  install runs on (for example platform-agent-host on the CI eval install, or
  the host cluster's own name on a dev install). The worker records at most one
  command entry (one card-log row, or one tagged call on a card with no log
  row), does not run kubectl config subcommands or gcloud container clusters
  list, and does not run find /... or search the filesystem for console-link
  helpers.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: a front-door question routed to the
# platform specialist.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: fkc1e100

verification_spec:
  - name: work-was-delegated-through-kanban
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      require_success: true
  - name: the-answer-names-the-host-context
    role: objective
    mode: assert
    check:
      # Under fold_decoration: true, inner underscores become hyphens before
      # _normalize strips Markdown emphasis, so gke_<project>_<location>_<cluster>
      # arrives as gke-<project>-<location>-<cluster> (with an optional space
      # after `:` on legacy domain-scoped project IDs like `example.com:my-project`
      # from _SEPARATOR_NO_SPACE) — and a kanban card ID like t_f7459698 arrives
      # as t-f7459698. The second pattern requires a standalone GCP location
      # token (<geo>-<direction><1-2 digits>[-<zone>]) outside that hyphen-joined
      # context so pasting KUBE_CONTEXT_NAME alone never passes even when a
      # folded card ID starts with hex letters.
      type: report_contains
      fold_decoration: true
      required_patterns:
        - '(?<![a-z0-9-])gke-(?:[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?:\s?)?[a-z0-9](?:[a-z0-9-]*[a-z0-9])?-[a-z]{2,}-(?:central|north|south|east|west|northeast|northwest|southeast|southwest)\d{1,2}(?:-[a-z])?-[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?![a-z0-9-])'
        - '(?<![a-z0-9-])[a-z]{2,}-(?:central|north|south|east|west|northeast|northwest|southeast|southwest)\d{1,2}(?:-[a-z])?(?![a-z0-9-])'
  - name: the-worker-read-the-forwarded-identity
    role: objective
    mode: assert
    check:
      # Matches an actual environment read of the forwarded host variables —
      # `printenv <VAR>` or `declare -p`/`typeset -p <VAR>` graded on argv via
      # `required_runs`, an outer-shell `$VAR`/`${VAR}` expansion, or a single
      # consolidated shell-read pattern sharing `_SHELL_EXEC_WRAPPERS` parity
      # across bare/piped environment dumps (`printenv`, `env`, `set`,
      # `export [-p]`, `declare -p`, `/proc/self/environ`), `for v in GKE_...`
      # indirect/printenv loops, `sh -c`/`bash -c` expansions, and `python`
      # (`-c` or heredoc) `os.environ`/`os.getenv` reads (including `GKE_`/
      # `KUBE_` prefix filters) — while rejecting commands that wipe or
      # override the forwarded variables (`env -i`, `env -u GKE_...`, or
      # command-position `VAR=...`), read unrelated variables (`printenv PATH`),
      # merely mention a variable name, or use `env` as an exec prefix.
      type: any
      checks:
        - type: worker_commands
          exempt_patterns: &env_ignore_exempt
            - '(?:^|[\s(;&|\x27\x22])(?:(?:/usr)?(?:/local)?/bin/)?env\s+(?:(?:-u|--unset)\s+\S+\s+|-\S+\s+|[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*(?:-[a-zA-Z]*i[a-zA-Z]*|--ignore-environment|(?:-u|--unset)(?:=|\s+)(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME))\b'
            - '(?:^(?:[^\x27\\\x22#]|(?<=\S)#|\\.|[\x27][^\x27]*[\x27]|\x22(?:[^\x22\\]|\\.)*\x22)*[;|&\n(]|^)\s*(?:\(\s*|[{}!]\s+|\b(?:do|then|else|export|declare|typeset)\b(?:\s+-[A-Za-z]+)*\s+|(?:\d*[<>]{1,3}&?\s*\S+|&>>?\s*\S+)\s+|(?!(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)=)[A-Za-z_][A-Za-z0-9_]*=(?:\x27[^\x27]*\x27|\x22(?:[^\x22\\]|\\.)*\x22|\S*)\s+|(?:(?:/usr)?(?:/local)?/bin/)?timeout(?:\s+(?:--|--[A-Za-z0-9-]+=\S+|-[^\s;|&)]+(?:\s+(?!(?:\d+(?:\.\d+)?[smhd]?|infinity|[\x22\x27]?\$\S+))(?!-)\S+)?))*\s+(?:\d+(?:\.\d+)?[smhd]?|infinity|[\x22\x27]?\$\S+)\s+|(?:(?:/usr)?(?:/local)?/bin/)?(?:flock|chroot)(?:\s+(?:--|--[A-Za-z0-9-]+=\S+|-[^\s;|&)]+(?:\s+(?!-)\S+)?))*\s+(?!-)\S+\s+|(?:(?:/usr)?(?:/local)?/bin/)?(?:nohup|env|time|nice|ionice|stdbuf|setsid|sudo|exec|command|xargs|watch|builtin)(?:\s+(?:--|--[A-Za-z0-9-]+=\S+|-[^\s;|&)]+(?:\s+(?!-)(?![A-Za-z_][A-Za-z0-9_]*=)(?!(?:(?:/usr)?(?:/local)?/bin/)?(?:ba|da|z|k|a)?sh\b)\S+)?|\d+(?:\.\d+)?[smhd]?|infinity|[\x22\x27]?\$\S+))*\s+|(?:(?:/usr)?(?:/local)?/bin/)?(?:ba|da|z|k|a)?sh\s+(?:-[A-Za-z]+\s+)*-[A-Za-z]*c\s+[\x27\x22]\s*(?:(?:[^\x27\x22;|&]|\x22(?:[^\x22\\]|\\.)*\x22)*[;|&]\s*)*)*(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)='
          required_runs:
            - script: printenv
              word_patterns:
                - "^(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)$"
        - type: worker_commands
          exempt_patterns: *env_ignore_exempt
          required_runs:
            - script: declare
              word_patterns:
                - "^-[a-zA-Z]*p[a-zA-Z]*$"
                - "^(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)$"
        - type: worker_commands
          exempt_patterns: *env_ignore_exempt
          required_runs:
            - script: typeset
              word_patterns:
                - "^-[a-zA-Z]*p[a-zA-Z]*$"
                - "^(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)$"
        - type: worker_commands
          exempt_patterns: *env_ignore_exempt
          required_patterns:
            - '^(?:[^\x27\\\x22#]|(?<=\S)#|\\.|[\x27][^\x27]*[\x27]|\x22(?:[^\x22\\]|\\.)*\x22)*(?:\x22(?:[^\x22\\]|\\.)*)?(?:\$(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)\b|\$\{(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)(?:[-:+?=#%/][^}]*)?\})'
        - type: worker_commands
          exempt_patterns: *env_ignore_exempt
          required_patterns:
            - '(?s)^\s*(?:\(\s*|[{}!]\s+|\b(?:do|then|else)\b\s+|(?:\d*[<>]{1,3}&?\s*\S+|&>>?\s*\S+)\s+|(?!(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)=)[A-Za-z_][A-Za-z0-9_]*=(?:\x27[^\x27]*\x27|\x22(?:[^\x22\\]|\\.)*\x22|\S*)\s+|(?:(?:/usr)?(?:/local)?/bin/)?timeout(?:\s+(?:--|--[A-Za-z0-9-]+=\S+|-[^\s;|&)]+(?:\s+(?!(?:\d+(?:\.\d+)?[smhd]?|infinity|[\x22\x27]?\$\S+))(?!-)\S+)?))*\s+(?:\d+(?:\.\d+)?[smhd]?|infinity|[\x22\x27]?\$\S+)\s+|(?:(?:/usr)?(?:/local)?/bin/)?(?:flock|chroot)(?:\s+(?:--|--[A-Za-z0-9-]+=\S+|-[^\s;|&)]+(?:\s+(?!-)\S+)?))*\s+(?!-)\S+\s+|(?:(?:/usr)?(?:/local)?/bin/)?(?:nohup|env|time|nice|ionice|stdbuf|setsid|sudo|exec|command|xargs|watch|builtin)(?:\s+(?:--|--[A-Za-z0-9-]+=\S+|-[^\s;|&)]+(?:\s+(?!-)(?!(?:(?:/usr)?(?:/local)?/bin/)?(?:printenv|env|set|export|declare|typeset|python[\d.]*|pypy3?|(?:ba|da|z|k|a)?sh|for|cat|strings|od|xxd|hexdump|head|tail|grep|egrep|fgrep|rg|sed|awk|gawk|mawk|tr|xargs)\b)\S+)?|\d+(?:\.\d+)?[smhd]?|infinity|[\x22\x27]?\$\S+))*\s+|(?:(?:/usr)?(?:/local)?/bin/)?(?:ba|da|z|k|a)?sh\s+(?:-[A-Za-z]+\s+)*-[A-Za-z]*c\s+[\x27\x22]\s*)*(?:(?:(?:(?:/usr)?(?:/local)?/bin/)?(?:printenv|env)(?:\s+(?:-0|--null|--))*|set|export(?:\s+-p)?|(?:declare|typeset)(?:\s+-[a-zA-Z]*p[a-zA-Z]*)?)(?=\s*(?:[);]|\|(?!\|)|&|[\x27\x22]\s*(?:[);&]|\|(?!\|)|$)|$))|(?:(?:cat|strings|od|xxd|hexdump|head|tail)\s+(?:-[A-Za-z0-9-]+\s+)*|(?:grep|egrep|fgrep|rg|sed|awk|gawk|mawk)\b[^|;&]*?\s+|(?:tr|xargs)\b[^|;&]*?<\s*)(?<![\x27\x22])/proc/(?:self|\$\$|\d+)/environ(?=\s*(?:\||;|&|\x27|\x22|$))|for\s+(?P<v>[A-Za-z_][A-Za-z0-9_]*)\s+in\b[^;\n]*\b(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)\b[^;\n]*(?:;|\n|\s)\s*do\b.*?(?:\$\{!(?P=v)\}|\$\{\(P\)(?P=v)\}|\b(?:printenv|(?:declare|typeset)\s+-[A-Za-z]*p[A-Za-z]*)\s+(?:--\s+)?[\x27\x22]?\\?\$\{?(?P=v)\}?[\x27\x22]?|\beval\b[^;\n]*\\?\$(?:\{(?P=v)\}|(?P=v))\b)|(?:(?:/usr)?(?:/local)?/bin/)?(?:python[\d.]*|pypy3?)(?:\s+-[A-Za-z0-9]+)*\s+-[A-Za-z0-9]*c\s+(?:\x27(?=[^\x27]*\bos\b)(?=[^\x27]*\b(?:environ|getenv)\b)[^\x27]*(?:GKE_(?:(?:CLUSTER_NAME|PROJECT_ID|LOCATION)\b|[\x27\x22|)])|KUBE_(?:CONTEXT(?:_NAME\b|[\x27\x22|)])|[\x27\x22|)]))[^\x27]*\x27|\x22(?=(?:[^\x22\\]|\\.)*\bos\b)(?=(?:[^\x22\\]|\\.)*\b(?:environ|getenv)\b)(?:[^\x22\\]|\\.)*(?:GKE_(?:(?:CLUSTER_NAME|PROJECT_ID|LOCATION)\b|\\?[\x27\x22|)])|KUBE_(?:CONTEXT(?:_NAME\b|\\?[\x27\x22|)])|\\?[\x27\x22|)]))(?:[^\x22\\]|\\.)*\x22|\\\x22(?=(?:[^\\]|\\(?![\x22]))*\bos\b)(?=(?:[^\\]|\\(?![\x22]))*\b(?:environ|getenv)\b)(?:[^\\]|\\(?![\x22]))*(?:GKE_(?:(?:CLUSTER_NAME|PROJECT_ID|LOCATION)\b|\\?[\x27\x22|)])|KUBE_(?:CONTEXT(?:_NAME\b|\\?[\x27\x22|)])|\\?[\x27\x22|)]))(?:[^\\]|\\(?![\x22]))*\\\x22)|(?:(?:/usr)?(?:/local)?/bin/)?(?:python[\d.]*|pypy3?)(?:\s+-[A-Za-z0-9]+)*\s+(?:-\s+)?<<-?\s*[\x27\x22]?(?P<eof>[A-Za-z_][A-Za-z0-9_]*)[\x27\x22]?\s+(?=(?:(?!\s(?P=eof)(?:\s|$)).)*\bos\b)(?=(?:(?!\s(?P=eof)(?:\s|$)).)*\b(?:environ|getenv)\b)(?:(?!\s(?P=eof)(?:\s|$)).)*(?:GKE_(?:(?:CLUSTER_NAME|PROJECT_ID|LOCATION)\b|\\?[\x27\x22|)])|KUBE_(?:CONTEXT(?:_NAME\b|\\?[\x27\x22|)])|\\?[\x27\x22|)]))(?:(?!\s(?P=eof)(?:\s|$)).)*\s(?P=eof)(?:\s|[\x27\x22]|$)|(?:(?:/usr)?(?:/local)?/bin/)?(?:ba|da|z|k|a)?sh\s+(?:-[A-Za-z]+\s+)*-[A-Za-z]*c\s+(?:\x27(?:[^\x27\\\x22#]|(?<=\S)#|\\[^\x27]|\x22(?:[^\x22\x27\\]|\\[^\x27])*\x22)*(?:\x22(?:[^\x22\x27\\]|\\[^\x27])*)?(?:\$(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)\b|\$\{(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)(?:[-:+?=#%/][^\x27}]*)?\})|\x22(?:[^\x27\\\x22#]|(?<=\S)#|\\\\|\\[^\x22\\$]|\x27[^\x27\x22]*\x27|\\\x22(?:[^\x22\\]|\\\\|\\[^\x22\\$])*\\\x22)*(?:\\\x22(?:[^\x22\\]|\\\\|\\[^\x22\\$])*)?(?<!\\)\\(?:\$(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)\b|\$\{(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)(?:[-:+?=#%/][^\x22}]*)?\})))'
  - name: the-worker-did-not-hunt-for-the-host
    role: objective
    mode: assert
    check:
      # Bounds recorded command entries (`max_commands: 1` counts card-log rows,
      # or tagged calls on a card with no log row, rather than shell segments or
      # `execute_code` calls beside a logged terminal row; Hermes's
      # collapsed-chain suffix ` + N command(s)` rejects `;`, `&&` and `||`
      # chains on one row — including an unquoted top-level `for ...; do ...;
      # done`, whose loop body `summarize_shell_command` strips to `+ 2
      # commands`, whereas newline-delimited or `sh -c`-quoted `for` loops keep
      # their body on the row — while splitting an off-denylist newline-joined
      # call, grading an unquoted `;`-delimited `for` loop on its raw call, or
      # counting `execute_code` calls on a logged card awaits #3971) and
      # forbids the routes the live and red-on-main runs took: `kubectl config`
      # subcommands and `gcloud container clusters list` on argv
      # (`forbidden_runs`), on newline-joined card-log rows, and inside
      # `python`/`python3` `-c` or heredoc programs (along with Python
      # subprocess/popen/system shell-outs, `.kube/config` reads, and root/glob
      # walks), any `find` rooted under `/`, and filesystem searches for
      # console-link helpers (`console.cloud.google.com` bound to an unquoted
      # search verb so an `echo` composing a Cloud Console link from the
      # forwarded variables still passes).
      type: worker_commands
      max_commands: 1
      forbidden_runs:
        - script: kubectl
          subcommands: ["config"]
        - script: gcloud
          subcommands: ["container", "clusters", "list"]
        - script: gcloud
          subcommands: ["beta", "container", "clusters", "list"]
        - script: gcloud
          subcommands: ["alpha", "container", "clusters", "list"]
      forbidden_patterns:
        - 'gcp-console-links|\*console\*|^(?:[^\x27\\\x22#]|(?<=\S)#|#[^\n]*(?=\n)|\\.|[\x27][^\x27]*[\x27]|\x22(?:[^\x22\\]|\\.)*\x22)*(?:^|[\s;|&(])(?:(?:(?:/usr)?(?:/local)?/bin/)?(?:ba|da|z|k|a)?sh\s+(?:-[A-Za-z]+\s+)*-[A-Za-z]*c\s+([\x27\x22])(?:(?:(?!\1).)*?[\s;|&(])?)?(?:(?:/usr)?(?:/local)?/bin/)?(?:find|e?grep|fgrep|rg|ls|locate)\b[^|;&]*console\.cloud\.google\.com'
        - '\bfind\s+/'
        - '\s\+\s\d+\s+commands?$'
