  - name: the-worker-did-not-hunt-for-the-host
    role: objective
    mode: assert
    check:
      # Bounds recorded command entries (`max_commands: 1` counts card-log rows,
      # or tagged calls on a card with no log row, rather than shell segments or
      # `execute_code` calls beside a logged terminal row; Hermes's
      # collapsed-chain suffix ` + N command(s)` rejects `;`, `&&` and `||`
      # chains on one row — including an unquoted top-level `for ...; do ...;
      # done`, whose loop body `summarize_shell_command` strips to `+ 2
      # commands`, whereas newline-delimited or `sh -c`-quoted `for` loops keep
      # their body on the row — while splitting an off-denylist newline-joined
      # call, splitting a newline-joined call whose earlier line ends with a
      # trailing `#` comment, grading an unquoted `;`-delimited `for` loop on
      # its raw call, or counting `execute_code` calls on a logged card awaits
      # #3971) and forbids the routes the live and red-on-main runs took:
      # `kubectl config` subcommands and `gcloud container clusters list` on
      # argv (`forbidden_runs`) and on uncommented newline-joined card-log rows
      # (both skipping unresolved `$` expansions such as `kubectl $OPTS config`
      # and intentionally erring toward denylist over-matching if a
      # space-separated pre-verb option value word equals `config`, such as
      # `kubectl -n config get pods`, unlike prefixed values such as `kubectl -n
      # config-management-system get pods`, inline `--namespace=config`/
      # `-nconfig`, or post-verb `get configmap config`), and inside interpreter
      # inline or heredoc programs (`python3`, `awk`, `perl`, etc., along with
      # subprocess/popen/system/getline/qx shell-outs, `$KUBECONFIG`/`.kube`
      # reads, `credential_proxy_client`/`container.googleapis.com` API-relay
      # calls, and root/glob walks), any `find` rooted under `/`, and filesystem
      # searches for console-link helpers (`console.cloud.google.com` bound to
      # an unquoted search verb so an `echo` composing a Cloud Console link from
      # the forwarded variables still passes).
      type: worker_commands
      max_commands: 1
      forbidden_runs:
        - script: kubectl
          subcommands: ["config"]
        - script: gcloud
          subcommands: ["container", "clusters", "list"]
        - script: gcloud
          subcommands: ["beta", "container", "clusters", "list"]
        - script: gcloud
          subcommands: ["alpha", "container", "clusters", "list"]
      forbidden_patterns:
        - 'gcp-console-links|\*console\*|^(?:[^\x27\\\x22#]|(?<=\S)#|(?<!\S)#[^\n]*(?=\n)|\\.|[\x27][^\x27]*[\x27]|\x22(?:[^\x22\\]|\\.)*\x22)*(?:^|[\s;|&(])(?:(?:(?:/usr)?(?:/local)?/bin/)?(?:ba|da|z|k|a)?sh\s+(?:-[A-Za-z]+\s+)*-[A-Za-z]*c\s+([\x27\x22])(?:(?:(?!\1).)*?[\s;|&(])?)?(?:(?:/usr)?(?:/local)?/bin/)?(?:find|e?grep|fgrep|rg|ls|locate)\b[^|;&]*console\.cloud\.google\.com'
