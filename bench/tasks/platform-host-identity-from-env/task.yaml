# Asked which cluster kube-agents runs on, the platform worker reads the host
# identity from its environment in one call instead of hunting for it (#3350).
#
# Seen live: "What cluster is kube-agents running on?" took a 3-minute,
# 44-turn kanban delegation. The worker searched the filesystem for
# gcp-console-links.md and listed the fleet with `gcloud container clusters
# list` before it answered. The operator already forwards the host's
# GKE_CLUSTER_NAME, GKE_PROJECT_ID, GKE_LOCATION and KUBE_CONTEXT_NAME into
# the shell sandbox (SANDBOX_FORWARDED_ENV_NAMES, deploy/sandbox/entrypoint.sh),
# and agents/platform/SOUL.md §1 "Host and Cluster Identity Queries" now says
# to read them and to not enumerate the fleet.
#
# The front door holds no infrastructure tools, so the question goes through
# kanban to the platform worker; worker_commands reads that worker's terminal.
# A front door that answers without delegating leaves nothing to read, which
# is status "error", not a pass.
#
# Which cluster hosts the install varies between CI (HOST_CLUSTER_NAME in
# hack/ci-env.sh, platform-agent-host) and dev clusters, so the report check
# grades the resolved gke_<project>_<location>_<cluster> context and standalone
# GCP location by shape rather than hardcoding one cluster name. report_contains
# deletes underscores as Markdown emphasis unless fold_decoration: true folds
# inner underscores to hyphens first, so the context pattern spells those
# separators with hyphens; the worker_commands checks below are what tie that
# triple to the forwarded host environment rather than another kubeconfig
# context.
#
# Red on main rests on the forbidden-route check: main's worker answered too,
# only slowly, so the context check and the env-read check pass there. The
# persona dictates a single call (`max_commands: 1`), and
# `printenv GKE_CLUSTER_NAME GKE_PROJECT_ID GKE_LOCATION KUBE_CONTEXT_NAME` is
# one unchained command. For a card the front door filed, worker_commands reads
# Hermes's one-line card-log rendering (summarize_shell_command), which
# collapses a `;`, `&&` or `||` chain to `<first command> + N command(s)` and
# joins newline-separated lines with spaces and no suffix; the forbidden-route
# check therefore rejects collapsed chains (`\s\+\s\d+\s+commands?$`) and
# carries quote- and `#`-comment-aware text patterns alongside `forbidden_runs`
# so a second-line `kubectl config` or `gcloud container clusters list` joined
# onto the env-read row still fails. A worker that reads os.environ through
# execute_code leaves no card-log row for it and fails the env-read check.
#
# Domain: chat and routing. Isolation class: read-only. Eligible tier: nightly.
id: platform-host-identity-from-env
name: Asked which cluster kube-agents runs on, the worker reads its environment and does not enumerate the fleet
prompt: >-
  What cluster is kube-agents running on? Give me the cluster name, its GCP
  project, its location and its kubectl context name.
expected_output: >-
  The front door files a kanban task for the platform specialist. The worker
  reads the host cluster's name, GCP project, location and kubectl context name
  from its environment (GKE_CLUSTER_NAME, GKE_PROJECT_ID, GKE_LOCATION and
  KUBE_CONTEXT_NAME) in a single unchained terminal call, and the answer states
  whatever host cluster name, GCP project, location and
  gke_<project>_<location>_<cluster> kubectl context name that install runs on
  (for example platform-agent-host on the CI eval install, or the host cluster's
  own name on a dev install). The worker issues at most one command, does not
  run kubectl config subcommands or gcloud container clusters list, and does not
  run find /... or search the filesystem for console-link helpers.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: a front-door question routed to the
# platform specialist.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: fkc1e100

verification_spec:
  - name: work-was-delegated-through-kanban
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      require_success: true
  - name: the-answer-names-the-host-context
    role: objective
    mode: assert
    check:
      # Under fold_decoration: true, inner underscores become hyphens before
      # _normalize strips Markdown emphasis, so gke_<project>_<location>_<cluster>
      # arrives as gke-<project>-<location>-<cluster> (with an optional space
      # after `:` on legacy domain-scoped project IDs like `example.com:my-project`
      # from _SEPARATOR_NO_SPACE) — and a kanban card ID like t_f7459698 arrives
      # as t-f7459698. The second pattern requires a standalone GCP location
      # token (<geo>-<direction><1-2 digits>[-<zone>]) outside that hyphen-joined
      # context so pasting KUBE_CONTEXT_NAME alone never passes even when a
      # folded card ID starts with hex letters.
      type: report_contains
      fold_decoration: true
      required_patterns:
        - '(?<![a-z0-9-])gke-(?:[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?:\s?)?[a-z0-9](?:[a-z0-9-]*[a-z0-9])?-[a-z]{2,}-(?:central|north|south|east|west|northeast|northwest|southeast|southwest)\d{1,2}(?:-[a-z])?-[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?![a-z0-9-])'
        - '(?<![a-z0-9-])[a-z]{2,}-(?:central|north|south|east|west|northeast|northwest|southeast|southwest)\d{1,2}(?:-[a-z])?(?![a-z0-9-])'
  - name: the-worker-read-the-forwarded-identity
    role: objective
    mode: assert
    check:
      # Matches an actual environment read of the forwarded host variables —
      # `printenv <VAR>` or `declare -p`/`typeset -p <VAR>` graded on argv via
      # `required_runs` (which steps over exec wrappers such as `timeout`,
      # `env`, `flock`, `--`, and `bash -c '...'`), a bare or piped environment
      # dump (`printenv`, `env`, `set`, `export [-p]`, `declare -p`, or reading
      # `/proc/self/environ`), a non-single-quoted shell `$VAR`/`${VAR}`
      # expansion (outer shell or inside `sh -c`/`bash -c`), or `python3` (`-c`
      # or heredoc) reading `os.environ`/`os.getenv` — while rejecting commands
      # that wipe or override the forwarded variables (`env -i` anywhere on the
      # command, `env -u GKE_...`, `env GKE_CLUSTER_NAME=foo ...`, or leading
      # `GKE_CLUSTER_NAME=foo ...`), read unrelated variables (`printenv PATH`),
      # merely mention a variable name (`grep KUBE_CONTEXT_NAME`, `echo
      # GKE_CLUSTER_NAME`, `bash -c 'echo GKE_CLUSTER_NAME'`), or use `env` as a
      # command-execution prefix (`env KUBECONFIG=... kubectl ...`).
      type: any
      checks:
        - type: worker_commands
          exempt_patterns: &env_ignore_exempt
            - '(?:^|[\s(;&|\x27\x22])(?:(?:/usr)?/bin/)?env\s+(?:(?:-u|--unset)\s+\S+\s+|-\S+\s+|[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*(?:-[a-zA-Z]*i[a-zA-Z]*|--ignore-environment|(?:-u|--unset)(?:=|\s+)(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME))\b'
            - '(?:^(?:[^\x27\\\x22#]|(?<=\S)#|\\.|[\x27][^\x27]*[\x27]|\x22(?:[^\x22\\]|\\.)*\x22)*[;|&\n(]|^)\s*(?:(?:[A-Za-z_][A-Za-z0-9_]*=(?:\x27[^\x27]*\x27|\x22(?:[^\x22\\]|\\.)*\x22|\S*)|(?:(?:/usr)?/bin/)?(?:timeout(?:\s+(?:--[a-z-]+=\S+|-[a-zA-Z]\s+\S+|--foreground|--preserve-status|-v|--verbose))*\s+\d+(?:\.\d+)?[smhd]?|nice(?:\s+-n\s*-?\d+)?|nohup|stdbuf(?:\s+-[ioe]\S+)+|flock(?:\s+-[a-zA-Z]+)*\s+\S+|command|builtin|export|declare|typeset|env(?:\s+(?:-\S+|(?:-u|--unset)\s+\S+))*))\s+)*(?:(?:(?:/usr)?/bin/)?(?:ba|da|z|k|a)?sh\s+(?:-[a-zA-Z]+\s+)*-[a-zA-Z]*c\s+[\x27\x22]\s*(?:\(\s*)*(?:(?:[^\x27\x22;|&]|\x22(?:[^\x22\\]|\\.)*\x22)*[;|&]\s*)*(?:(?:[A-Za-z_][A-Za-z0-9_]*=\S*|(?:(?:/usr)?/bin/)?(?:timeout\s+\d+(?:\.\d+)?[smhd]?|nice(?:\s+-n\s*-?\d+)?|nohup|command|builtin|export|declare|typeset|env(?:\s+(?:-\S+|(?:-u|--unset)\s+\S+))*))\s+)*)?(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)='
          required_runs:
            - script: printenv
              word_patterns:
                - "^(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)$"
        - type: worker_commands
          exempt_patterns: *env_ignore_exempt
          required_runs:
            - script: declare
              word_patterns:
                - "^-[a-zA-Z]*p[a-zA-Z]*$"
                - "^(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)$"
        - type: worker_commands
          exempt_patterns: *env_ignore_exempt
          required_runs:
            - script: typeset
              word_patterns:
                - "^-[a-zA-Z]*p[a-zA-Z]*$"
                - "^(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)$"
        - type: worker_commands
          exempt_patterns: *env_ignore_exempt
          required_patterns:
            - '^\s*(?:\(\s*)*(?:(?:(?!(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)=)[A-Za-z_][A-Za-z0-9_]*=\S+|(?:(?:/usr)?/bin/)?(?:timeout(?:\s+(?:--[a-z-]+=\S+|-[a-zA-Z]\s+\S+|--foreground|--preserve-status|-v|--verbose))*\s+\d+(?:\.\d+)?[smhd]?|nice(?:\s+-n\s*-?\d+)?|nohup|stdbuf(?:\s+-[ioe]\S+)+|flock(?:\s+-[a-zA-Z]+)*\s+\S+|command|builtin|env(?:\s+(?:-0|--null|-u\s+\S+|--unset=\S+))*))\s+)*(?:(?:(?:/usr)?/bin/)?(?:printenv|env)(?:\s+(?:-0|--null|--))*|set|export(?:\s+-p)?|(?:declare|typeset)(?:\s+-[a-zA-Z]*p[a-zA-Z]*)?)(?=\s*(?:\)|\|(?!\|)|;|&|$))'
        - type: worker_commands
          exempt_patterns: *env_ignore_exempt
          required_patterns:
            - '^\s*(?:(?:(?:/usr)?/bin/)?(?:timeout(?:\s+(?:--[a-z-]+=\S+|-[a-zA-Z]\s+\S+|--foreground|--preserve-status|-v|--verbose))*\s+\d+(?:\.\d+)?[smhd]?|nice(?:\s+-n\s*-?\d+)?|nohup|stdbuf(?:\s+-[ioe]\S+)+|flock(?:\s+-[a-zA-Z]+)*\s+\S+|command|builtin|env(?:\s+(?:-0|--null|-u\s+\S+|--unset=\S+))*)\s+)*(?:(?:/usr)?/bin/)?(?:ba|da|z|k|a)?sh\s+(?:-[a-zA-Z]+\s+)*-[a-zA-Z]*c\s+([\x27\x22])\s*(?:\(\s*)*(?:(?:(?:/usr)?/bin/)?(?:timeout(?:\s+(?:--[a-z-]+=\S+|-[a-zA-Z]\s+\S+|--foreground|--preserve-status|-v|--verbose))*\s+\d+(?:\.\d+)?[smhd]?|nice(?:\s+-n\s*-?\d+)?|nohup|command|builtin|env(?:\s+(?:-0|--null|-u\s+\S+|--unset=\S+))*)\s+)*(?:(?:(?:/usr)?/bin/)?(?:printenv|env)(?:\s+(?:-0|--null|--))*|set|export(?:\s+-p)?|(?:declare|typeset)(?:\s+-[a-zA-Z]*p[a-zA-Z]*)?)(?=\s*(?:\)|\|(?!\|)|;|&|\1))'
        - type: worker_commands
          exempt_patterns: *env_ignore_exempt
          required_patterns:
            - '^\s*(?:(?:(?:/usr)?/bin/)?(?:timeout(?:\s+(?:--[a-z-]+=\S+|-[a-zA-Z]\s+\S+|--foreground|--preserve-status|-v|--verbose))*\s+\d+(?:\.\d+)?[smhd]?|nice(?:\s+-n\s*-?\d+)?|nohup|stdbuf(?:\s+-[ioe]\S+)+|flock(?:\s+-[a-zA-Z]+)*\s+\S+|command|builtin|env(?:\s+(?:-0|--null|-u\s+\S+|--unset=\S+))*)\s+)*(?:(?:(?:/usr)?/bin/)?(?:ba|da|z|k|a)?sh\s+(?:-[a-zA-Z]+\s+)*-[a-zA-Z]*c\s+[\x27\x22]\s*)?(?:(?:cat|strings|od|xxd|hexdump|head|tail)\s+(?:-[A-Za-z0-9-]+\s+)*|(?:grep|egrep|fgrep|rg|sed|awk|gawk|mawk)\b[^|;&]*?\s+|(?:tr|xargs)\b[^|;&]*?<\s*)(?<![\x27\x22])/proc/(?:self|\$\$|\d+)/environ(?=\s*(?:\||;|&|\x27|\x22|$))'
        - type: worker_commands
          exempt_patterns: *env_ignore_exempt
          required_patterns:
            - '^(?:[^\x27\\\x22#]|(?<=\S)#|\\.|[\x27][^\x27]*[\x27]|\x22(?:[^\x22\\]|\\.)*\x22)*(?:\x22(?:[^\x22\\]|\\.)*)?(?:\$(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)\b|\$\{(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)(?:[-:+?=#%/][^}]*)?\})'
        - type: worker_commands
          exempt_patterns: *env_ignore_exempt
          required_patterns:
            - '^\s*(?:(?:(?:/usr)?/bin/)?(?:timeout(?:\s+(?:--[a-z-]+=\S+|-[a-zA-Z]\s+\S+|--foreground|--preserve-status|-v|--verbose))*\s+\d+(?:\.\d+)?[smhd]?|nice(?:\s+-n\s*-?\d+)?|nohup|stdbuf(?:\s+-[ioe]\S+)+|flock(?:\s+-[a-zA-Z]+)*\s+\S+|command|builtin|env(?:\s+(?:-0|--null|-u\s+\S+|--unset=\S+))*)\s+)*(?:(?:/usr)?/bin/)?(?:ba|da|z|k|a)?sh\s+(?:-[a-zA-Z]+\s+)*-[a-zA-Z]*c\s+(?:\x27(?:[^\x27\\\x22#]|(?<=\S)#|\\[^\x27]|\x22(?:[^\x22\x27\\]|\\[^\x27])*\x22)*(?:\x22(?:[^\x22\x27\\]|\\[^\x27])*)?(?:\$(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)\b|\$\{(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)(?:[-:+?=#%/][^\x27}]*)?\})|\x22(?:[^\x27\\\x22#]|(?<=\S)#|\\\\|\\[^\x22\\$]|\x27[^\x27\x22]*\x27|\\\x22(?:[^\x22\\]|\\\\|\\[^\x22\\$])*\\\x22)*(?:\\\x22(?:[^\x22\\]|\\\\|\\[^\x22\\$])*)?(?<!\\)\\(?:\$(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)\b|\$\{(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)(?:[-:+?=#%/][^\x22}]*)?\}))'
        - type: worker_commands
          exempt_patterns: *env_ignore_exempt
          required_patterns:
            - '^\s*(?:(?:(?:/usr)?/bin/)?(?:timeout(?:\s+(?:--[a-z-]+=\S+|-[a-zA-Z]\s+\S+|--foreground|--preserve-status|-v|--verbose))*\s+\d+(?:\.\d+)?[smhd]?|nice(?:\s+-n\s*-?\d+)?|nohup|stdbuf(?:\s+-[ioe]\S+)+|flock(?:\s+-[a-zA-Z]+)*\s+\S+|command|builtin|env(?:\s+(?:-0|--null|-u\s+\S+|--unset=\S+))*)\s+)*(?:(?:(?:/usr)?/bin/)?(?:ba|da|z|k|a)?sh\s+(?:-[a-zA-Z]+\s+)*-[a-zA-Z]*c\s+[\x27\x22]\s*)?(?:(?:/usr)?/bin/)?python3?(?:\s+-[A-Za-z0-9]+)*\s+-c\s+(?:\x27(?=[^\x27]*\bos\b)(?=[^\x27]*\b(?:environ|getenv)\b)[^\x27]*\b(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)\b[^\x27]*\x27|\x22(?=(?:[^\x22\\]|\\.)*\bos\b)(?=(?:[^\x22\\]|\\.)*\b(?:environ|getenv)\b)(?:[^\x22\\]|\\.)*\b(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)\b(?:[^\x22\\]|\\.)*\x22)'
        - type: worker_commands
          exempt_patterns: *env_ignore_exempt
          required_patterns:
            - '(?s)^\s*(?:(?:(?:/usr)?/bin/)?(?:timeout(?:\s+(?:--[a-z-]+=\S+|-[a-zA-Z]\s+\S+|--foreground|--preserve-status|-v|--verbose))*\s+\d+(?:\.\d+)?[smhd]?|nice(?:\s+-n\s*-?\d+)?|nohup|stdbuf(?:\s+-[ioe]\S+)+|flock(?:\s+-[a-zA-Z]+)*\s+\S+|command|builtin|env(?:\s+(?:-0|--null|-u\s+\S+|--unset=\S+))*)\s+)*(?:(?:/usr)?/bin/)?python3?(?:\s+-[A-Za-z0-9]+)*\s+(?:-\s+)?<<-?\s*[\x27\x22]?([A-Za-z_][A-Za-z0-9_]*)[\x27\x22]?\s+(?=(?:(?!\s\1(?:\s|$)).)*\bos\b)(?=(?:(?!\s\1(?:\s|$)).)*\b(?:environ|getenv)\b)(?:(?!\s\1(?:\s|$)).)*\b(?:GKE_(?:CLUSTER_NAME|PROJECT_ID|LOCATION)|KUBE_CONTEXT_NAME)\b(?:(?!\s\1(?:\s|$)).)*\s\1(?:\s|$)'
  - name: the-worker-did-not-hunt-for-the-host
    role: objective
    mode: assert
    check:
      # Enforces the single-call contract (`max_commands: 1` plus Hermes's
      # collapsed-chain suffix ` + N command(s)`) and forbids the routes the
      # live and red-on-main runs took: `kubectl config` subcommands and
      # `gcloud container clusters list` on argv (`forbidden_runs`) and on
      # newline-joined card-log rows (`summarize_shell_command` turns `\n` into
      # a space with no `+ N command(s)` suffix, so quote- and `#`-comment-aware
      # text patterns catch a second-line `kubectl config` or `gcloud container
      # clusters list` without matching quoted grep arguments, comments, or
      # non-config verbs such as `kubectl get configmap config`), any `find`
      # rooted under `/`, and filesystem searches for console-link helpers
      # (`console.cloud.google.com` bound to an unquoted search verb so an
      # `echo` composing a Cloud Console link from the forwarded variables still
      # passes).
      type: worker_commands
      max_commands: 1
      forbidden_runs:
        - script: kubectl
          subcommands: ["config"]
        - script: gcloud
          subcommands: ["container", "clusters", "list"]
        - script: gcloud
          subcommands: ["beta", "container", "clusters", "list"]
        - script: gcloud
          subcommands: ["alpha", "container", "clusters", "list"]
      forbidden_patterns:
        - 'gcp-console-links|\*console\*|^(?:[^\x27\\\x22#]|(?<=\S)#|#[^\n]*(?=\n)|\\.|[\x27][^\x27]*[\x27]|\x22(?:[^\x22\\]|\\.)*\x22)*(?:^|[\s;|&(])(?:(?:(?:/usr)?(?:/local)?/bin/)?(?:ba|da|z|k|a)?sh\s+(?:-[A-Za-z]+\s+)*-[A-Za-z]*c\s+([\x27\x22])(?:(?:(?!\1).)*?[\s;|&(])?)?(?:(?:/usr)?(?:/local)?/bin/)?(?:find|e?grep|fgrep|rg|ls|locate)\b[^|;&]*console\.cloud\.google\.com'
        - '\bfind\s+/'
        - '\s\+\s\d+\s+commands?$'
        - '^(?:[^\x27\\\x22#]|(?<=\S)#|#[^\n]*(?=\n)|\\.|[\x27][^\x27]*[\x27]|\x22(?:[^\x22\\]|\\.)*\x22)*(?:^|[\s;|&(])(?:(?:(?:/usr)?(?:/local)?/bin/)?(?:ba|da|z|k|a)?sh\s+(?:-[A-Za-z]+\s+)*-[A-Za-z]*c\s+([\x27\x22])(?:(?:(?!\1).)*?[\s;|&(])?)?(?:(?:/usr)?(?:/local)?/bin/)?kubectl(?:\s+(?:--[A-Za-z0-9-]+=\S+|(?:--[A-Za-z0-9-]+|-(?!-)\S+)(?:\s+(?:\x27[^\x27]*\x27|\x22(?:[^\x22\\]|\\.)*\x22|(?!config\b)(?!-)\S+))?))*\s+(?:--\s+)?config\b'
        - '^(?:[^\x27\\\x22#]|(?<=\S)#|#[^\n]*(?=\n)|\\.|[\x27][^\x27]*[\x27]|\x22(?:[^\x22\\]|\\.)*\x22)*(?:^|[\s;|&(])(?:(?:(?:/usr)?(?:/local)?/bin/)?(?:ba|da|z|k|a)?sh\s+(?:-[A-Za-z]+\s+)*-[A-Za-z]*c\s+([\x27\x22])(?:(?:(?!\1).)*?[\s;|&(])?)?(?:(?:/usr)?(?:/local)?/bin/)?gcloud(?:\s+(?:--[A-Za-z0-9-]+=\S+|(?:--[A-Za-z0-9-]+|-(?!-)\S+)(?:\s+(?:\x27[^\x27]*\x27|\x22(?:[^\x22\\]|\\.)*\x22|(?!container\b|clusters\b|list\b|alpha\b|beta\b)(?!-)\S+))?))*(?:\s+(?:alpha|beta)\b(?:\s+(?:--[A-Za-z0-9-]+=\S+|(?:--[A-Za-z0-9-]+|-(?!-)\S+)(?:\s+(?:\x27[^\x27]*\x27|\x22(?:[^\x22\\]|\\.)*\x22|(?!container\b|clusters\b|list\b|alpha\b|beta\b)(?!-)\S+))?))*)?\s+container\b(?:\s+(?:--[A-Za-z0-9-]+=\S+|(?:--[A-Za-z0-9-]+|-(?!-)\S+)(?:\s+(?:\x27[^\x27]*\x27|\x22(?:[^\x22\\]|\\.)*\x22|(?!container\b|clusters\b|list\b|alpha\b|beta\b)(?!-)\S+))?))*\s+clusters\b(?:\s+(?:--[A-Za-z0-9-]+=\S+|(?:--[A-Za-z0-9-]+|-(?!-)\S+)(?:\s+(?:\x27[^\x27]*\x27|\x22(?:[^\x22\\]|\\.)*\x22|(?!container\b|clusters\b|list\b|alpha\b|beta\b)(?!-)\S+))?))*\s+list\b'
  # The delegation boundary, as in chat-routing-fleet-question: the front door
  # files the card and never works it.
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
