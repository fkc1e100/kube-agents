name: Release Build, Verification & Publish Pipeline

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ─── GATE 1: Static & Code Verification ──────────────────────────────────────
  gate-1-static-build-verification:
    name: "Gate 1: Static & Build Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Repo Structure
        run: make validate

      - name: Set up Go
        uses: actions/setup-go@f15714e099163ef30d4482fc6fc3452b4700d1d6 # v5.3.0
        with:
          go-version: "1.23"

      - name: Run Operator Unit Tests
        run: cd k8s-operator && go test -v ./...

      - name: Run Shellcheck Analysis
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install.sh uninstall.sh upgrade.sh

      - name: Validate Documentation & Links
        run: make docs-check

  # ─── GATE 2: Container & Helm Packaging Verification ─────────────────────────
  gate-2-packaging-verification:
    name: "Gate 2: Container & Helm Packaging Verification"
    needs: gate-1-static-build-verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Lint & Template Helm Chart
        run: |
          SET_FLAGS=(
            --set platformAgent.harness.clusterName=release-cluster
            --set platformAgent.harness.location=us-central1
            --set platformAgent.harness.projectId=release-project
          )
          helm lint charts/kube-agents "${SET_FLAGS[@]}"
          helm template test-release charts/kube-agents "${SET_FLAGS[@]}" > /dev/null

      - name: Package Chart
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_NUM="${TAG_NAME#v}"
          mkdir -p build/dist
          helm package charts/kube-agents --version "${VERSION_NUM}" --app-version "${VERSION_NUM}" -d build/dist

      - name: Upload Helm Package Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: helm-chart-package
          path: build/dist/*.tgz

  # ─── GATE 3: Ephemeral E2E & Smoke Test Suite ────────────────────────────────
  gate-3-e2e-smoke-tests:
    name: "Gate 3: Ephemeral E2E Smoke Tests"
    needs: gate-2-packaging-verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Ephemeral Kind Cluster
        uses: helm/kind-action@0025e7512861e65337e72ab66e3abce2327de800 # v1.10.0
        with:
          cluster_name: kube-agents-release-gate

      - name: Test Non-Interactive Dry-Run Execution
        run: |
          ./install.sh --dry-run -y --project-id="release-project" --cluster-name="release-cluster" --region="us-central1"
          ./upgrade.sh --dry-run -y --upgrade-mode=skills
          ./uninstall.sh --dry-run -y --project-id="release-project" --cluster-name="release-cluster" --region="us-central1"

  # ─── PUBLISH: GitHub Release & Artifact Distribution ─────────────────────────
  create-github-release:
    name: "Publish Official GA Release"
    needs: [gate-1-static-build-verification, gate-2-packaging-verification, gate-3-e2e-smoke-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Helm Package Artifact
        uses: actions/download-artifact@cc3a90e0912f99e436d720780287e07eb443be47 # v4.1.9
        with:
          name: helm-chart-package
          path: build/dist/

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@c95fe0f8961523530c02eb60e1d03da2b8ec8d73 # v2.2.1
        with:
          files: |
            build/dist/*.tgz
          generate_release_notes: true
          draft: false
          prerelease: false
