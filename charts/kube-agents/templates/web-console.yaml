{{- if .Values.webConsole.enabled }}
{{- $agentName := .Values.platformAgent.name | default "platform-agent" }}
{{- $secretName := .Values.platformAgent.credentials.secretName | default "platform-agent-secrets" }}
{{- $tag := .Values.webConsole.image.tag | default .Chart.AppVersion }}
{{- $repo := include "kube-agents.imageRepository" (dict "repository" .Values.webConsole.image.repository "registry" .Values.global.imageRegistry) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web-console
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: web-console
    app.kubernetes.io/component: web-console
    {{- include "kube-agents.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.webConsole.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: web-console
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-console
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web-console
        {{- include "kube-agents.labels" . | nindent 8 }}
    spec:
      {{- with include "kube-agents.imagePullSecrets" . }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: web-console
          image: {{ printf "%s:%s" $repo $tag | quote }}
          imagePullPolicy: {{ .Values.webConsole.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: HERMES_URL
              value: {{ printf "http://%s.%s.svc.cluster.local:8642" $agentName .Release.Namespace | quote }}
            - name: SESSION_KV_URL
              value: {{ printf "http://%s.%s.svc.cluster.local:8642" $agentName .Release.Namespace | quote }}
            - name: LITELLM_URL
              value: {{ printf "http://litellm.%s.svc.cluster.local:4000" .Release.Namespace | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.platformAgent.harness.clusterName | default "gke-cluster" | quote }}
            - name: PROJECT_ID
              value: {{ .Values.platformAgent.harness.projectId | default "gcp-project" | quote }}
            - name: LOCATION
              value: {{ .Values.platformAgent.harness.location | default "us-central1" | quote }}
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName | quote }}
                  key: API_SERVER_KEY
                  optional: true
            - name: SESSION_KV_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName | quote }}
                  key: SESSION_KV_API_KEY
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.webConsole.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.webConsole.securityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web-console
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: web-console
    app.kubernetes.io/component: web-console
    {{- include "kube-agents.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webConsole.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.webConsole.service.port | default 8080 }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.webConsole.service.type "NodePort") .Values.webConsole.service.nodePort }}
      nodePort: {{ .Values.webConsole.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: web-console
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
